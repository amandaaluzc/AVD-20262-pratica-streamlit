# Configuração do Streamlit. Descomente e ajuste conforme o projeto avançar.
# O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
paddingTop = "0.5rem"     # espaço abaixo da barra do topo (valor entre aspas)
# font = "sans serif"     # "sans serif", "serif" ou "monospace"

[theme.light]
primaryColor = "#2f6f8f"            # cor de destaque (widgets, links)
backgroundColor = "#f5f7fa"         # fundo da página
secondaryBackgroundColor = "#e6eef5"  # fundo da sidebar e de widgets
textColor = "#1f2d3a"               # cor do texto
borderColor = "#9fb3c8"

[theme.dark]
primaryColor = "#ff4b4b"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#262730"
textColor = "#fafafa"
borderColor = "#41444e"
